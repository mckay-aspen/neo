name: NEO Minimal checks
on:
  push:
    paths: ['minimal/**', '.github/workflows/minimal.yml']
  pull_request:
    paths: ['minimal/**', '.github/workflows/minimal.yml']
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: minimal
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run check
  mac-desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: minimal
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features desktop -- -D warnings
      - run: bun run tauri build --debug --bundles app
