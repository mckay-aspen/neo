[package]
name = "neo-minimal"
version = "0.1.0"
description = "A quiet, local-first writing desk inspired by NEO"
authors = ["NEO Minimal contributors"]
edition = "2021"
rust-version = "1.89"
license = "MIT"

[lib]
name = "neo_minimal"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "neo-minimal"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri = { version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }
